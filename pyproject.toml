[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "ogbench"
version = "1.2.1+pickxiguapi.1"
requires-python = ">=3.10,<3.13"
dependencies = [
    "mujoco >= 3.1.6",
    "dm_control >= 1.0.20",
    "gymnasium[mujoco]",
    "pygame == 2.6.1",
    "pymunk == 7.1.0",
    "opencv-python-headless == 4.11.0.86",
]
authors = [
    { name = "Seohong Park" },
    { name = "Kevin Frans" },
    { name = "Benjamin Eysenbach" },
    { name = "Sergey Levine" },
]
maintainers = [
    { name = "Seohong Park", email = "seohong@berkeley.edu" }
]
license = { file = "LICENSE" }
classifiers = ["License :: OSI Approved :: MIT License"]
dynamic = ["description"]

[project.optional-dependencies]
train = [
    "jax == 0.4.33",
    "flax == 0.8.5",
    "distrax == 0.1.5",
    "ml_collections",
    "matplotlib",
    "moviepy",
    "wandb",
    "h5py",
    "hdf5plugin",
    "imageio[ffmpeg]",
    "lancedb == 0.36.0",
    "pylance == 9.0.1",
    "pillow",
]
dev = [
    "pytest",
    "ruff",
]
cuda12 = [
    "jax[cuda12] == 0.4.33; platform_system == 'Linux'",
]
all = [
    "ogbench[train,dev]",
]

[project.urls]
Home = "https://github.com/pickxiguapi/ogbench"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
quote-style = "single"

[tool.pytest.ini_options]
pythonpath = [".", "impls"]
